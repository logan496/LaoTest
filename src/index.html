<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <link href="output.css" rel="stylesheet">
    <title>Facebook_page</title>
</head>
<body class="bg-gray-100">
<div class="flex justify-center items-center sm:flex-col lg:flex-row md:flex-row pt-32">
    <div class="flex flex-col justify-center items-center md:px-16">
        <h1 class="font-bold text-blue-600 font-sans sm:text-5xl md:text-6xl lg:text-9xl">
            facebook
        </h1>
        <p class="sm:text-mg  text-gray-700 md:text-lg lg:text-2xl">
            Connect with friends and the world<br/>
            <span class="sm:pl-7">around you on Facebook.</span>
        </p>
    </div>
    <div class="shadow-lg border-solid border-1 border-black rounded-lg bg-gray-100 sm:p-3 md:p-3 lg:p-10 lg:shadow-xl">
        <form method="post" class="flex justify-center items-center flex-col">
            <input type="text" class="input"
                   placeholder="Email or phone number"/>

            <input type="password" class="input"
                   placeholder="Password"/>

            <input type="submit" class="submit-button-login" value="Login"/>

            <input type="submit" class="submit-button-forgot-password" value="Forgot password ?"/>

            <input type="submit" class="submit-button-new-account" value="Create new account"/>
        </form>
    </div>
</div>
</body>
</html>
